services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: harborcart
      MYSQL_USER: harborcart
      MYSQL_PASSWORD: ${DB_PASSWORD:-harborcart_local_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  mysql-data:
  redis-data:
